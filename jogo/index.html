<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jundiaí City - André</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87b5e0;font-family:system-ui,sans-serif}
  #hud{position:fixed;left:12px;top:12px;color:#fff;text-shadow:0 1px 3px #000;font-size:15px;line-height:1.5;pointer-events:none}
  #hud b{font-size:20px}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;background:#0009;text-align:center;padding:20px}
  #help{position:fixed;right:12px;bottom:12px;color:#fff;background:#0006;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div id="hud"><b>André</b><br><span id="mode">A pé</span> · <span id="spd">0</span> km/h<br>📍 <span id="rua">Jundiaí</span></div>
<div id="help">W/S andar/acelerar · A/D virar · Shift correr<br>E entrar/sair do carro · Espaço freio de mão · R resetar carro</div>
<div id="msg">Carregando ruas e prédios de Jundiaí (OpenStreetMap)...</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---- Área: Centro de Jundiaí ----
const LAT0 = -23.1866, LON0 = -46.8845, R = 0.009; // ~1 km de raio
const BBOX = [LAT0 - R, LON0 - R, LAT0 + R, LON0 + R].join(',');
const KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KZ = 110540;
const proj = p => [(p.lon - LON0) * KX, -(p.lat - LAT0) * KZ]; // x = leste, z = sul

const msg = document.getElementById('msg');

async function loadOSM() {
  try { const r = await fetch('jundiai.json'); if (r.ok) return await r.json(); } catch (e) {}
  const q = `[out:json][timeout:90];(way["highway"](${BBOX});way["building"](${BBOX}););out geom;`;
  for (const url of ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter']) {
    try {
      const r = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q) });
      if (r.ok) return await r.json();
    } catch (e) {}
  }
  return null;
}

// ---- Cena ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5e0);
scene.fog = new THREE.Fog(0x87b5e0, 150, 700);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.5, 2000);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

scene.add(new THREE.HemisphereLight(0xdfefff, 0x55603f, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(80, 150, 60); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, far: 400 });
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshLambertMaterial({ color: 0x6f8f4e }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ---- Grade espacial (colisão e nome de rua) ----
const CELL = 40, key = (x, z) => Math.floor(x / CELL) + ',' + Math.floor(z / CELL);
const bGrid = new Map(), rGrid = new Map(), buildings = [], roadSegs = [];
function addToGrid(grid, idx, minx, minz, maxx, maxz) {
  for (let i = Math.floor(minx / CELL); i <= Math.floor(maxx / CELL); i++)
    for (let j = Math.floor(minz / CELL); j <= Math.floor(maxz / CELL); j++) {
      const k = i + ',' + j; (grid.get(k) || grid.set(k, []).get(k)).push(idx);
    }
}
function inPoly(x, z, P) {
  let c = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++)
    if ((P[i][1] > z) !== (P[j][1] > z) && x < (P[j][0] - P[i][0]) * (z - P[i][1]) / (P[j][1] - P[i][1]) + P[i][0]) c = !c;
  return c;
}
function hitsBuilding(x, z, r) {
  for (const [dx, dz] of [[0, 0], [r, 0], [-r, 0], [0, r], [0, -r]]) {
    const list = bGrid.get(key(x + dx, z + dz)); if (!list) continue;
    for (const i of list) if (inPoly(x + dx, z + dz, buildings[i])) return true;
  }
  return false;
}
function streetAt(x, z) {
  let best = null, bd = 400;
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const list = rGrid.get((Math.floor(x / CELL) + i) + ',' + (Math.floor(z / CELL) + j)); if (!list) continue;
    for (const s of list) {
      const [ax, az, bx, bz, name] = roadSegs[s];
      const vx = bx - ax, vz = bz - az, t = Math.max(0, Math.min(1, ((x - ax) * vx + (z - az) * vz) / (vx * vx + vz * vz || 1)));
      const d = (ax + vx * t - x) ** 2 + (az + vz * t - z) ** 2;
      if (d < bd) { bd = d; best = name; }
    }
  }
  return best;
}

// ---- Construção do mundo ----
const ROADW = { motorway: 14, trunk: 12, primary: 11, secondary: 10, tertiary: 9, residential: 7, unclassified: 7, living_street: 6, service: 4, pedestrian: 5, footway: 2, path: 2, steps: 2 };
const colorOf = h => ['pedestrian', 'footway', 'path', 'steps'].includes(h) ? 0xb9b2a5 : 0x3a3a3e;

function buildWorld(data) {
  const roadGeoms = { 0x3a3a3e: [], 0xb9b2a5: [] }, bGeoms = [];
  const col = new THREE.Color();
  for (const el of data.elements) {
    if (el.type !== 'way' || !el.geometry) continue;
    const pts = el.geometry.map(proj), t = el.tags || {};
    if (t.building) {
      if (pts.length < 4) continue;
      const poly = pts.slice(0, -1);
      const lv = parseFloat(t['building:levels']) || (2 + Math.floor(Math.random() * 3));
      const h = parseFloat(t.height) || lv * 3.2;
      const shape = new THREE.Shape(poly.map(([x, z]) => new THREE.Vector2(x, -z)));
      const g = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
      g.rotateX(-Math.PI / 2);
      col.setHSL(0.08 + Math.random() * 0.06, 0.15 + Math.random() * 0.2, 0.55 + Math.random() * 0.25);
      const n = g.attributes.position.count, c = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) col.toArray(c, i * 3);
      g.setAttribute('color', new THREE.BufferAttribute(c, 3));
      bGeoms.push(g);
      let a = Infinity, b = Infinity, cc = -Infinity, d = -Infinity;
      for (const [x, z] of poly) { a = Math.min(a, x); b = Math.min(b, z); cc = Math.max(cc, x); d = Math.max(d, z); }
      addToGrid(bGrid, buildings.push(poly) - 1, a, b, cc, d);
    } else if (t.highway && ROADW[t.highway]) {
      const w = ROADW[t.highway] / 2, y = w > 3 ? 0.06 + w * 0.002 : 0.04, pos = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const [ax, az] = pts[i], [bx, bz] = pts[i + 1];
        const L = Math.hypot(bx - ax, bz - az) || 1, nx = -(bz - az) / L * w, nz = (bx - ax) / L * w;
        pos.push(ax + nx, y, az + nz, bx + nx, y, bz + nz, ax - nx, y, az - nz,
                 bx + nx, y, bz + nz, bx - nx, y, bz - nz, ax - nx, y, az - nz);
        if (t.name && w > 2) addToGrid(rGrid, roadSegs.push([ax, az, bx, bz, t.name]) - 1, Math.min(ax, bx), Math.min(az, bz), Math.max(ax, bx), Math.max(az, bz));
      }
      // disco nas juntas para curvas suaves
      for (const [x, z] of pts) for (let k = 0; k < 8; k++) {
        const a1 = k / 8 * Math.PI * 2, a2 = (k + 1) / 8 * Math.PI * 2;
        pos.push(x, y, z, x + Math.cos(a2) * w, y, z + Math.sin(a2) * w, x + Math.cos(a1) * w, y, z + Math.sin(a1) * w);
      }
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      roadGeoms[colorOf(t.highway)].push(g);
    }
  }
  for (const c in roadGeoms) if (roadGeoms[c].length) {
    const g = mergeGeometries(roadGeoms[c]); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: +c, side: THREE.DoubleSide }));
    m.receiveShadow = true; scene.add(m);
  }
  if (bGeoms.length) {
    const m = new THREE.Mesh(mergeGeometries(bGeoms), new THREE.MeshLambertMaterial({ vertexColors: true }));
    m.castShadow = m.receiveShadow = true; scene.add(m);
  }
}

// Mundo de reserva se o OSM não carregar
function fakeData() {
  const els = [], g = (x, z) => ({ lon: LON0 + x / KX, lat: LAT0 - z / KZ });
  for (let i = -5; i <= 5; i++) {
    els.push({ type: 'way', tags: { highway: 'secondary', name: 'Rua ' + (i + 6) }, geometry: [g(i * 80, -440), g(i * 80, 440)] });
    els.push({ type: 'way', tags: { highway: 'residential', name: 'Avenida ' + (i + 6) }, geometry: [g(-440, i * 80), g(440, i * 80)] });
  }
  for (let i = -5; i < 5; i++) for (let j = -5; j < 5; j++) {
    const x = i * 80 + 12, z = j * 80 + 12, s = 56;
    els.push({ type: 'way', tags: { building: 'yes', 'building:levels': 1 + Math.floor(Math.random() * 6) }, geometry: [g(x, z), g(x + s, z), g(x + s, z + s), g(x, z + s), g(x, z)] });
  }
  return { elements: els };
}

// ---- André e o carro ----
function makeAndre() {
  const grp = new THREE.Group(), M = c => new THREE.MeshLambertMaterial({ color: c });
  const add = (geo, mat, y) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; m.castShadow = true; grp.add(m); return m; };
  add(new THREE.BoxGeometry(0.5, 0.9, 0.3), M(0x2255aa), 1.05); // camisa
  add(new THREE.BoxGeometry(0.45, 0.8, 0.28), M(0x333333), 0.4); // calça
  add(new THREE.SphereGeometry(0.22, 12, 10), M(0xc68e5e), 1.75); // cabeça
  return grp;
}
function makeCar() {
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.7, 4.2), new THREE.MeshLambertMaterial({ color: 0xcc1f1f }));
  body.position.y = 0.65; const cab = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2), new THREE.MeshLambertMaterial({ color: 0x223344 }));
  cab.position.set(0, 1.25, -0.3); grp.add(body, cab);
  const wg = new THREE.CylinderGeometry(0.38, 0.38, 0.3, 14); wg.rotateZ(Math.PI / 2);
  for (const [x, z] of [[0.95, 1.35], [-0.95, 1.35], [0.95, -1.35], [-0.95, -1.35]]) {
    const w = new THREE.Mesh(wg, new THREE.MeshLambertMaterial({ color: 0x111111 })); w.position.set(x, 0.38, z); grp.add(w);
  }
  const lg = new THREE.BoxGeometry(0.4, 0.15, 0.05), lm = new THREE.MeshBasicMaterial({ color: 0xffffcc });
  for (const x of [0.6, -0.6]) { const l = new THREE.Mesh(lg, lm); l.position.set(x, 0.75, 2.11); grp.add(l); }
  grp.traverse(o => o.castShadow = true);
  return grp;
}
const andre = makeAndre(), car = makeCar();
scene.add(andre, car);

const P = { x: 0, z: 0, h: 0 };                 // André
const C = { x: 0, z: 0, h: 0, v: 0, sx: 0, sz: 0 }; // carro
let driving = false;

function findSpawn() {
  // ponto de rua com nome mais próximo do centro, sem prédio
  let best = null, bd = Infinity;
  for (const [ax, az, bx, bz] of roadSegs) {
    const x = (ax + bx) / 2, z = (az + bz) / 2, d = x * x + z * z;
    if (d < bd && !hitsBuilding(x, z, 2)) { bd = d; best = [x, z, Math.atan2(bx - ax, bz - az)]; }
  }
  return best || [0, 0, 0];
}
function resetCar() { [C.x, C.z, C.h] = [C.sx, C.sz, C.sh]; C.v = 0; }

// ---- Controles ----
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE') {
    if (!driving && Math.hypot(P.x - C.x, P.z - C.z) < 4) { driving = true; andre.visible = false; }
    else if (driving && Math.abs(C.v) < 3) {
      driving = false; andre.visible = true;
      P.x = C.x - Math.cos(C.h) * 2; P.z = C.z + Math.sin(C.h) * 2; P.h = C.h;
    }
  }
  if (e.code === 'KeyR') resetCar();
});
addEventListener('keyup', e => keys[e.code] = false);

// ---- Loop ----
const hudMode = document.getElementById('mode'), hudSpd = document.getElementById('spd'), hudRua = document.getElementById('rua');
const camPos = new THREE.Vector3(), look = new THREE.Vector3();
let last = performance.now(), streetTimer = 0;

function update(dt) {
  const fw = (keys.KeyW || keys.ArrowUp) ? 1 : 0, bk = (keys.KeyS || keys.ArrowDown) ? 1 : 0;
  const st = ((keys.KeyA || keys.ArrowLeft) ? 1 : 0) - ((keys.KeyD || keys.ArrowRight) ? 1 : 0);
  if (driving) {
    const MAX = 33; // ~120 km/h
    if (fw) C.v += (C.v < 0 ? 25 : 12) * dt;
    if (bk) C.v -= (C.v > 0 ? 25 : 8) * dt;
    if (!fw && !bk) C.v -= Math.sign(C.v) * Math.min(Math.abs(C.v), 4 * dt);
    if (keys.Space) C.v -= Math.sign(C.v) * Math.min(Math.abs(C.v), 30 * dt);
    C.v = Math.max(-10, Math.min(MAX, C.v));
    C.h += st * dt * Math.min(1, Math.abs(C.v) / 6) * Math.sign(C.v) * (keys.Space ? 2.6 : 1.7);
    const nx = C.x + Math.sin(C.h) * C.v * dt, nz = C.z + Math.cos(C.h) * C.v * dt;
    if (!hitsBuilding(nx + Math.sin(C.h) * 2 * Math.sign(C.v), nz + Math.cos(C.h) * 2 * Math.sign(C.v), 0.9)) { C.x = nx; C.z = nz; }
    else C.v *= -0.3; // batida
    P.x = C.x; P.z = C.z;
  } else {
    const sp = (keys.ShiftLeft || keys.ShiftRight) ? 7 : 3;
    P.h += st * 2.5 * dt;
    const m = (fw - bk * 0.6) * sp * dt, nx = P.x + Math.sin(P.h) * m, nz = P.z + Math.cos(P.h) * m;
    if (!hitsBuilding(nx, nz, 0.3)) { P.x = nx; P.z = nz; }
    andre.children.forEach((c, i) => i === 1 && (c.scale.y = 1 + Math.sin(performance.now() / 90) * 0.05 * (fw || bk)));
  }
  car.position.set(C.x, 0, C.z); car.rotation.y = C.h;
  andre.position.set(P.x, 0, P.z); andre.rotation.y = P.h;

  // câmera em 3ª pessoa
  const tx = driving ? C.x : P.x, tz = driving ? C.z : P.z, th = driving ? C.h : P.h;
  const dist = driving ? 10 + Math.abs(C.v) * 0.12 : 5, hgt = driving ? 4.5 : 2.6;
  camPos.set(tx - Math.sin(th) * dist, hgt, tz - Math.cos(th) * dist);
  camera.position.lerp(camPos, 1 - Math.pow(0.002, dt));
  look.set(tx, driving ? 1.2 : 1.5, tz); camera.lookAt(look);
  sun.position.set(tx + 80, 150, tz + 60); sun.target.position.set(tx, 0, tz);

  hudMode.textContent = driving ? '🚗 Dirigindo' : (Math.hypot(P.x - C.x, P.z - C.z) < 4 ? 'A pé — aperte E para entrar' : 'A pé');
  hudSpd.textContent = driving ? Math.round(Math.abs(C.v) * 3.6) : 0;
  if ((streetTimer -= dt) < 0) { streetTimer = 0.4; hudRua.textContent = (streetAt(tx, tz) || 'Jundiaí') + ', Jundiaí - SP'; }
}
function loop(now) {
  update(Math.min(0.05, (now - last) / 1000)); last = now;
  renderer.render(scene, camera); requestAnimationFrame(loop);
}

// ---- Início ----
let data = await loadOSM(), real = !!(data && data.elements && data.elements.length);
if (!real) data = fakeData();
buildWorld(data);
const [sx, sz, sh] = findSpawn();
Object.assign(C, { x: sx, z: sz, h: sh, sx, sz, sh });
P.x = sx - Math.cos(sh) * 2.5; P.z = sz + Math.sin(sh) * 2.5; P.h = sh;
camera.position.set(P.x - 5, 4, P.z - 5);
msg.style.display = 'none';
if (!real) { msg.textContent = 'Não foi possível baixar o OpenStreetMap — usando cidade de teste.'; msg.style.display = 'flex'; setTimeout(() => msg.style.display = 'none', 3000); }
requestAnimationFrame(loop);
</script>
</body>
</html>
