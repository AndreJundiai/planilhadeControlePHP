# Gera o APK do Auto Theft Jundiaí (jogo-web + Capacitor) e publica num Release para baixar no celular.
name: APK Android + PC — Auto Theft Jundiaí

on:
  push:
    branches: [ccr-7a80c689-1hm3ar]
    paths: ['jogo-web/**', '.github/workflows/apk-android.yml']
  workflow_dispatch:

permissions:
  contents: write # para criar o Release com o APK

# um envio novo cancela a compilação anterior (evita dois downloads do mapa ao mesmo tempo no OpenStreetMap)
concurrency:
  group: apk-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jogo-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jogo-web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      # EDITOR TIME: mapa de Jundiaí pré-processado (vai dentro do APK; zero download no jogo).
      # Os downloads brutos do OpenStreetMap ficam em cache e acumulam entre execuções: se uma execução
      # não terminar tudo no tempo, a próxima continua de onde parou (e as completas levam ~1 min).
      - name: Restaurar downloads do mapa
        uses: actions/cache/restore@v4
        with:
          path: jogo-web/.bake-cache
          key: osm-raw-v2-${{ github.run_id }}
          restore-keys: osm-raw-v2-

      - name: Pré-processar o mapa de Jundiaí (OpenStreetMap)
        continue-on-error: true # se o OpenStreetMap falhar, o APK sai com o que deu (o resto baixa no jogo)
        timeout-minutes: 42
        env:
          BAKE_BUDGET_MIN: 36 # para de baixar aos 36 min e grava o que tiver
        run: npm run bake

      - name: Guardar downloads do mapa (mesmo se incompleto)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: jogo-web/.bake-cache
          key: osm-raw-v2-${{ github.run_id }}

      - name: Tamanho do mapa embutido
        run: |
          du -sh public/map/jundiai 2>/dev/null || echo "sem mapa pré-processado"
          cat public/map/jundiai/index.json 2>/dev/null || true

      - name: Compilar o jogo (Vite)
        run: npm run build

      - name: Teste de fumaça (o jogo abre, anda, dirige, missão, pausa, salva — sem erros)
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          (npx vite preview --port 4173 --strictPort > /dev/null 2>&1 &)
          sleep 3
          npm run smoke

      - name: Guardar o jogo compilado (para a versão PC)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: jogo-web/dist
          retention-days: 3

      - name: Copiar o jogo para o projeto Android (Capacitor)
        run: npx cap sync android

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Usando a chave salva nos segredos do repositório."
          else
            mkdir -p ~/.android
            [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Sem segredo ANDROID_KEYSTORE_BASE64: usando chave temporária (para atualizar, desinstale a versão antiga)."
          fi

      - name: Gerar o APK (release assinado)
        working-directory: jogo-web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../AutoTheftJundiai.apk
          ls -la ../AutoTheftJundiai.apk

      - name: Guardar o APK (artefato do Actions)
        uses: actions/upload-artifact@v4
        with:
          name: AutoTheftJundiai-apk
          path: jogo-web/AutoTheftJundiai.apk

      - name: Publicar no Release (link para baixar no celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v${{ github.run_number }}"
          gh release create "$TAG" AutoTheftJundiai.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Auto Theft Jundiaí — versão ${{ github.run_number }} (Android + PC)" \
            --notes "**Android:** baixe o AutoTheftJundiai.apk no celular, abra e permita instalar de fontes desconhecidas.

          **PC Windows:** baixe o AutoTheftJundiai-Windows-portatil.exe e dê dois cliques (não precisa instalar; se o Windows avisar, clique em Mais informações → Executar assim mesmo). Ou o .zip, se preferir descompactar.

          **PC Linux:** baixe o AutoTheftJundiai-Linux.AppImage, marque como executável e abra.

          Os arquivos do PC aparecem aqui alguns minutos depois do APK."

  # Versão PC (Electron): o mesmo jogo compilado acima, empacotado para Windows (.exe portátil + .zip) e Linux (AppImage)
  pc:
    needs: apk
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: jogo-web/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jogo-web/desktop/package-lock.json

      - name: Baixar o jogo compilado
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: jogo-web/desktop/app

      - name: Instalar Electron
        run: npm ci

      - name: Gerar a versão PC
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # sem certificado de assinatura de código
        run: npm run ${{ matrix.script }}

      - name: Publicar no Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(ls release/*.exe release/*.zip release/*.AppImage 2>/dev/null || true)
          echo "$FILES"
          gh release upload "apk-v${{ github.run_number }}" $FILES --clobber --repo "${{ github.repository }}"
