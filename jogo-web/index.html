<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jundiaí City</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="mission"><div id="mission-title"></div><div id="objective"></div><div id="timer"></div></div>
    <div id="status">
      <div id="stars"></div>
      <div id="health"><div id="health-bar"></div></div>
      <div id="briefcase">💼 Maleta</div>
    </div>
    <div id="minimap"><div id="mm-map"></div><canvas id="mm-canvas" width="440" height="440"></canvas><div id="mm-player"></div></div>
    <div id="street"></div>
    <div id="speed"></div>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="call"><div class="from"></div><div class="text"></div></div>
    <div id="bubbles"></div>
    <div id="perf"></div>
    <div id="help">WASD mover · Mouse câmera (clique para travar) · Shift correr · Espaço pular / freio de mão · E entrar/sair/interagir · H buzina · G gráficos</div>
  </div>
  <div id="loading">Carregando...</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
